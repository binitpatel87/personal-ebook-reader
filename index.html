<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2328">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Books">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>My Books</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LIBRARY -->
  <section id="library" class="view active">
    <header class="topbar">
      <h1>My Books</h1>
      <button id="share-btn" class="btn" hidden>Sharing</button>
      <button id="sync-btn" class="btn" hidden>Refresh</button>
      <label class="btn primary" for="file-input">+ Add book</label>
      <input id="file-input" type="file" accept=".epub,.pdf,application/epub+zip,application/pdf" multiple hidden>
    </header>

    <div class="cloudbar" id="cloudbar">
      <span id="cloud-status">Checking cloud sync…</span>
      <button id="signin-btn" class="btn" hidden>Sign in with Google</button>
      <button id="signout-btn" class="btn" hidden>Sign out</button>
    </div>

    <p id="empty-msg" class="empty" hidden>No books yet. Tap <b>+ Add book</b> to add an EPUB or PDF file you own.</p>
    <ul id="shelf" class="shelf"></ul>
    <p class="note" id="storage-note"></p>
  </section>

  <!-- READER -->
  <section id="reader" class="view">
    <header class="topbar reader-top">
      <button id="back-btn" class="btn" aria-label="Back to library">&larr; Library</button>
      <span id="reader-title" class="reader-title"></span>
      <button id="aa-btn" class="btn" aria-label="Text size and font" hidden>Aa</button>
      <button id="notes-btn" class="btn" aria-label="Highlights and bookmarks">Notes</button>
    </header>

    <div class="reader-body" id="reader-body">
      <div id="epub-view" class="epub-view" hidden></div>
      <div id="pdf-view" class="pdf-view" hidden>
        <div class="pdf-pages" id="pdf-pages"></div>
      </div>
      <!-- Selection / highlight menu (built by app.js) -->
      <div id="hl-menu" class="hl-menu" hidden></div>
    </div>

    <!-- PDF drawing and markup tools -->
    <div id="pdf-tools" class="pdf-tools" hidden>
      <button class="tool on" data-tool="select">Read</button>
      <button class="tool" data-tool="highlight">Highlight</button>
      <button class="tool" data-tool="underline">Underline</button>
      <button class="tool" data-tool="pen">Pen</button>
      <button class="tool" data-tool="marker">Marker</button>
      <button class="tool" data-tool="eraser">Eraser</button>
      <span class="tool-sep" aria-hidden="true"></span>
      <span id="pdf-colors" class="pdf-colors"></span>
      <button id="pdf-undo" class="tool">Undo</button>
    </div>

    <footer class="reader-bottom">
      <button id="prev-btn" class="btn" aria-label="Previous page">&lsaquo;</button>
      <div class="progress-wrap">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-text" class="progress-text">0%</span>
      </div>
      <button id="next-btn" class="btn" aria-label="Next page">&rsaquo;</button>
      <button id="bookmark-btn" class="btn" aria-label="Bookmark this page">Bookmark</button>
    </footer>
  </section>

  <!-- NOTES PANEL -->
  <div id="notes-panel" class="panel" hidden>
    <div class="panel-card">
      <header class="panel-head">
        <h2>Highlights &amp; bookmarks</h2>
        <button id="notes-close" class="btn" aria-label="Close">Close</button>
      </header>
      <ul id="notes-list" class="notes-list"></ul>
    </div>
  </div>

  <!-- SHARE THE LIBRARY (owner only) -->
  <div id="share-panel" class="panel" hidden>
    <div class="panel-card">
      <header class="panel-head">
        <h2>Share your library</h2>
        <button id="share-close" class="btn" aria-label="Close">Close</button>
      </header>
      <div id="share-body" class="share-body"></div>
    </div>
  </div>

  <!-- READING SETTINGS (EPUB) -->
  <div id="settings-panel" class="panel panel-clear" hidden>
    <div class="panel-card">
      <header class="panel-head">
        <h2>Reading settings</h2>
        <button id="settings-close" class="btn" aria-label="Close">Done</button>
      </header>
      <div class="settings-body">
        <div class="set-row">
          <span>Text size</span>
          <span class="set-ctl">
            <button id="fs-minus" class="btn" aria-label="Smaller text">A&minus;</button>
            <span id="fs-val" class="fs-val">100%</span>
            <button id="fs-plus" class="btn" aria-label="Larger text">A+</button>
          </span>
        </div>
        <div class="set-row">
          <label for="font-select">Font</label>
          <select id="font-select" class="select">
            <option value="Georgia, 'Times New Roman', serif">Georgia (serif)</option>
            <option value="'Palatino Linotype', 'Book Antiqua', Palatino, serif">Palatino (serif)</option>
            <option value="'Times New Roman', Times, serif">Times New Roman</option>
            <option value="Arial, Helvetica, sans-serif">Arial (sans-serif)</option>
            <option value="Verdana, Geneva, sans-serif">Verdana (sans-serif)</option>
            <option value="'Trebuchet MS', Tahoma, sans-serif">Trebuchet</option>
            <option value="'Courier New', Courier, monospace">Courier (typewriter)</option>
          </select>
        </div>
        <div class="set-row">
          <label for="lh-select">Line spacing</label>
          <select id="lh-select" class="select">
            <option value="1.25">Tight</option>
            <option value="1.5">Normal</option>
            <option value="1.8">Relaxed</option>
            <option value="2.1">Wide</option>
          </select>
        </div>
        <div class="set-row">
          <span>Page colour</span>
          <span class="set-ctl" id="theme-row">
            <button class="btn theme" data-theme="light">Light</button>
            <button class="btn theme" data-theme="sepia">Sepia</button>
            <button class="btn theme" data-theme="dark">Dark</button>
            <button class="btn theme" data-theme="auto">Auto</button>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- DICTIONARY -->
  <div id="dict-panel" class="panel" hidden>
    <div class="panel-card">
      <header class="panel-head">
        <h2 id="dict-title">Dictionary</h2>
        <button id="dict-close" class="btn" aria-label="Close">Close</button>
      </header>
      <div id="dict-body" class="dict-body"></div>
    </div>
  </div>

  <!-- Small message with optional Undo -->
  <div id="toast" class="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-action" class="toast-action" hidden></button>
  </div>

  <!-- Busy overlay (downloading / uploading) -->
  <div id="loading" class="loading" hidden>
    <div class="loading-card"><span id="loading-text">Working…</span></div>
  </div>

  <!-- External libraries (pinned versions) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
